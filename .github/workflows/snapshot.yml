name: Relay Snapshot Dispatch

on:
  workflow_dispatch:
    inputs:
      test_discord_alert:
        description: 'Send a test Discord alert and exit (skips snapshot + inactivity check)'
        type: boolean
        default: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for alert state persistence)
        uses: actions/checkout@v4

      - name: Test Discord alert
        if: inputs.test_discord_alert == true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'SCRIPT'
          const urls = (process.env.DISCORD_WEBHOOK_URL || '').split(',').map(s => s.trim()).filter(Boolean);
          if (!urls.length) { console.log('No DISCORD_WEBHOOK_URL configured.'); process.exit(1); }
          for (const url of urls) {
              const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content: '✅ Test alert from PS99 Clan Battle relay — Discord notifications are working correctly.' }),
              });
              console.log(`Webhook responded: ${res.status}`);
          }
          SCRIPT

      - name: Trigger Ps99petsvscoins snapshot
        if: inputs.test_discord_alert != true
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/jojoonline83/Ps99petsvscoins/actions/workflows/snapshot.yml/dispatches \
            -d '{"ref":"claude/clan-battle-leaderboard-ghchnh"}'

      - name: Wait for snapshot to publish
        if: inputs.test_discord_alert != true
        run: sleep 90

      - name: Check inactivity and alert Discord
        if: inputs.test_discord_alert != true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node --input-type=module <<'SCRIPT'
          import { readFileSync, writeFileSync, existsSync, mkdirSync } from 'node:fs';

          const HISTORY_URL = 'https://jojoonline83.github.io/Ps99petsvscoins/history.json';
          const MONITOR_PLAYERS = ['jojo8', 'wintheasura', 'doughboy', 'diskobull'];
          const STATE_DIR = '.github/monitor-data';
          const STATE_FILE = `${STATE_DIR}/clanbattle_alert_state.json`;

          function webhookUrls() {
              return (process.env.DISCORD_WEBHOOK_URL || '').split(',').map(s => s.trim()).filter(Boolean);
          }

          async function sendDiscordAlert(message) {
              const urls = webhookUrls();
              if (!urls.length) {
                  console.log(`Discord not configured — would alert: ${message}`);
                  return;
              }
              for (const url of urls) {
                  try {
                      await fetch(url, {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ content: message }),
                          signal: AbortSignal.timeout(10000),
                      });
                  } catch (err) {
                      console.log(`Discord alert failed: ${err.message}`);
                  }
              }
          }

          // Fetch published history
          let history;
          try {
              const res = await fetch(`${HISTORY_URL}?t=${Date.now()}`, { signal: AbortSignal.timeout(30000) });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              history = await res.json();
          } catch (err) {
              console.log(`Failed to fetch history.json: ${err.message}`);
              process.exit(0);
          }

          if (history.length < 2) {
              console.log(`Only ${history.length} snapshot(s) — not enough for delta checks.`);
              process.exit(0);
          }

          function findSnapshotNear(msAgo, toleranceMs) {
              const latest = history[history.length - 1];
              const targetTs = latest.ts - msAgo;
              const minAgeMs = msAgo / 2;
              let best = null, bestDiff = Infinity;
              for (const entry of history) {
                  if (entry === latest) continue;
                  if (latest.ts - entry.ts < minAgeMs) continue;
                  const diff = Math.abs(entry.ts - targetTs);
                  if (diff < bestDiff) { bestDiff = diff; best = entry; }
              }
              return best && bestDiff <= toleranceMs ? best : null;
          }

          if (!existsSync(STATE_DIR)) mkdirSync(STATE_DIR, { recursive: true });
          let alertState = {};
          if (existsSync(STATE_FILE)) {
              try { alertState = JSON.parse(readFileSync(STATE_FILE, 'utf8')); } catch (_) { alertState = {}; }
          }

          const snap10 = findSnapshotNear(10 * 60_000, 11 * 60_000);
          const snap30 = findSnapshotNear(30 * 60_000, 8  * 60_000);
          const snap1h = findSnapshotNear(60 * 60_000, 12 * 60_000);

          const monitorSet = new Set(MONITOR_PLAYERS.map(n => n.toLowerCase()));
          const latest = history[history.length - 1];
          const allPlayers = [];
          for (const clan of latest.clans) {
              for (const p of clan.roster) {
                  allPlayers.push({ ...p, Clan: clan.Name });
              }
          }
          const monitored = allPlayers.filter(p => monitorSet.has(p.DisplayName.toLowerCase()));

          let alertCount = 0;
          for (const player of monitored) {
              const windows = [
                  { label: '10m', snap: snap10 },
                  { label: '30m', snap: snap30 },
                  { label: '1h',  snap: snap1h },
              ];
              for (const w of windows) {
                  if (!w.snap) continue;
                  const pastClan = w.snap.clans.find(c => c.Name === player.Clan);
                  const past = pastClan?.roster?.find(p => p.UserID === player.UserID)?.Points;
                  if (past == null) continue;

                  const key = `${player.UserID}:${w.label}`;
                  const isStalled = player.Points - past === 0;
                  if (isStalled && !alertState[key]) {
                      await sendDiscordAlert(`⚠️ **${player.DisplayName}** (Clan Battle) has earned 0 points over the last ${w.label} — possibly inactive (currently ${player.Points.toLocaleString()} pts, clan: ${player.Clan}).`);
                      alertState[key] = true;
                      alertCount++;
                  } else if (!isStalled) {
                      alertState[key] = false;
                  }
              }
          }

          writeFileSync(STATE_FILE, JSON.stringify(alertState));
          console.log(`Checked ${monitored.length} player(s), sent ${alertCount} alert(s).`);
          SCRIPT

      - name: Persist alert state
        if: inputs.test_discord_alert != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .github/monitor-data
          git diff --cached --quiet && exit 0
          git commit -m "chore: update clan battle alert state"
          git push || true
