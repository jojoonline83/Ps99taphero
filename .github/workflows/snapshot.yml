name: Relay Snapshot Dispatch

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger League snapshot
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/jojoonline83/Ps99clanbattle/actions/workflows/snapshot-taphero.yml/dispatches \
            -d '{"ref":"claude/ps99-clan-battle-tracker-5N9NW"}' || echo "League dispatch failed"
